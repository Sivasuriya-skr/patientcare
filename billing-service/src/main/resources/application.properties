spring.application.name=billing-service

server.port=4001
grpc.server.port=9001

# ✅ BATCH 3 FIX: Added DB config so billing accounts are actually persisted
# Values are overridden by docker-compose environment variables at runtime
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://billing-service-db:5432/billing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin1}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=billing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer