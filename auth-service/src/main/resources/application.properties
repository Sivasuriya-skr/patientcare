spring.application.name=auth-service

server.port=4005

# ✅ FIX: Credentials now match docker-compose.yml (was postgres/root → admin/admin1)
# ✅ FIX: DB name now matches docker-compose.yml (was auth_service_db → auth_db)
spring.datasource.url=jdbc:postgresql://auth-service-db:5432/auth_db
spring.datasource.username=admin
spring.datasource.password=admin1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never

# ✅ FIX: JWT secret moved to environment variable — NEVER hardcode secrets in source files
# Set JWT_SECRET in your .env file or docker-compose environment section
jwt.secret=${JWT_SECRET:CHANGE_ME_USE_ENV_VARIABLE_IN_PRODUCTION}
